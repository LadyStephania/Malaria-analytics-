<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal Login | Malaria Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background: radial-gradient(circle at 0% 0%, #f1f5f9 0%, #dbeafe 100%) !important;
            height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;
        }
        .login-card {
            max-width: 420px; width: 100%; border: none !important; border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04) !important; background: #ffffff !important;
            border-top: 5px solid #0d6efd !important; padding: 40px !important;
        }
        .form-label { font-weight: 600; color: #475569; font-size: 0.82rem; text-transform: uppercase; }
        .form-control { border-radius: 8px !important; border: 2px solid #cbd5e1 !important; padding: 12px 14px !important; }
        .btn-login { background-color: #0d6efd !important; border: none !important; padding: 12px !important; border-radius: 8px !important; font-weight: 600 !important; color: white !important; }
    </style>
</head>
<body>
<div class="container px-3 d-flex justify-content-center">
    <div class="card login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 50px; height: 50px; font-size: 1.3rem;">🔬</div>
            <h3 class="fw-bold m-0">MALARIA INSIGHTS</h3>
            <p class="text-muted small">Surveillance & Climate Predictive Analytics</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            {% if messages %}
                {% for m in messages %}<div class="alert alert-danger border-0 small p-2 mb-3 text-center" style="background-color:#fff5f5; color:#c53030;">{{ m }}</div>{% endfor %}
            {% endif %}
            <div class="mb-3">
                <label class="form-label mb-1" for="loginUsername">System Username</label>
                <input type="text" id="loginUsername" name="username" class="form-control" placeholder="e.g. j.mwanza" autofocus required>
            </div>
            <div class="mb-4">
                <label class="form-label mb-1" for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100 mb-3 shadow-sm">Secure System Authenticate</button>
        </form>
        <div class="text-center p-2 mt-2 rounded" style="background-color:#f8fafc; color:#64748b; font-size:0.75rem; font-weight:500;">🔒 Regulated under Zambia Data Protection Act (2021)</div>
    </div>
</div>
</body>
</html>
